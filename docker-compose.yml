version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_shortener
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: shortener_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_shortener_data:/var/lib/postgresql/data

volumes:
  postgres_shortener_data: